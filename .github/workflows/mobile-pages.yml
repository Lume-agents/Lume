name: Mobile PWA

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "mobile-pwa/**"
      # The phone app is built from the Workspace's own modules, so a change to any of them changes it.
      - "src/lib/**"
      - "vite.mobile.config.js"
      - "scripts/validate-mobile-assets.mjs"
      - "tests/response-dedup.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish mobile web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and validate the mobile app
        run: npm run check:mobile
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-pwa
      - id: deployment
        uses: actions/deploy-pages@v4
