name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  LUME_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('preview-{0}', github.run_id) }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
          - os: windows-2022
            args: --bundles nsis
          - os: macos-15
            args: --bundles dmg,app --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          workspaces: './src-tauri -> target'
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libfuse2 pkg-config rpm squashfs-tools
      - name: Runtime do AppImage
        if: runner.os == 'Linux'
        run: curl --fail --location --silent --show-error --output "$RUNNER_TEMP/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
      - name: AppRun com permissões compatíveis com sandbox
        if: runner.os == 'Linux'
        run: |
          tauri_cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tauri_cache_dir"
          curl --fail --location --silent --show-error --output "$tauri_cache_dir/AppRun-x86_64" https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 0755 "$tauri_cache_dir/AppRun-x86_64"
          test "$(stat -c '%a' "$tauri_cache_dir/AppRun-x86_64")" = 755
      - name: Configuração de assinatura macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          LUME_INPUT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          LUME_INPUT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          LUME_INPUT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          LUME_INPUT_APPLE_ID: ${{ secrets.APPLE_ID }}
          LUME_INPUT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          LUME_INPUT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          configured=0
          missing=()
          for name in "${names[@]}"; do
            input="LUME_INPUT_$name"
            value="${!input}"
            if [[ -z "$value" ]]; then
              missing+=("$name")
            else
              configured=$((configured + 1))
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                echo "::error::$name must contain a single line."
                exit 1
              fi
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "::warning::Apple signing is not configured; macOS artifacts will not have Developer ID signing or notarization."
            exit 0
          fi
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Incomplete Apple signing configuration. Missing secrets: ${missing[*]}"
            exit 1
          fi
          # Tauri imports the certificate into a temporary keychain, signs and
          # notarizes the app. Leave these variables unset for unsigned builds.
          for name in "${names[@]}"; do
            input="LUME_INPUT_$name"
            printf '%s=%s\n' "$name" "${!input}" >> "$GITHUB_ENV"
          done
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          LDAI_RUNTIME_FILE: ${{ runner.temp }}/runtime-x86_64
        with:
          tagName: ${{ env.LUME_RELEASE_TAG }}
          releaseName: Lume v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: lume-[platform]-[arch]-[bundle]
      - name: Verificar permissão do launcher dentro do AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "::error::O build não gerou um AppImage."
            exit 1
          fi
          offset="$("$appimage" --appimage-offset)"
          listing="$RUNNER_TEMP/lume-appimage-files.txt"
          unsquashfs -lln -o "$offset" "$appimage" > "$listing"
          mode="$(awk '$NF == "squashfs-root/AppRun.wrapped" { print $1 }' "$listing")"
          if [[ "$mode" != "-rwxr-xr-x" ]]; then
            echo "::error::AppRun.wrapped precisa ser executável por todos; modo encontrado: ${mode:-ausente}."
            exit 1
          fi
          echo "AppRun.wrapped validado com modo $mode."

  mobile-android:
    name: Android mobile
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Android signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::warning::Android signing secrets are missing; the mobile APK was not published."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lume-mobile.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/lume-mobile.jks" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build signed Android application
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run mobile:sync
          ./android/gradlew -p android assembleRelease --no-daemon
      - name: Prepare mobile release assets
        if: steps.signing.outputs.configured == 'true'
        id: assets
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi
          apk="$RUNNER_TEMP/Lume-Mobile.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          node scripts/mobile-release-manifest.mjs \
            --version "$version" \
            --apk "$apk" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$LUME_RELEASE_TAG" \
            --output "$RUNNER_TEMP/mobile-latest.json"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "manifest=$RUNNER_TEMP/mobile-latest.json" >> "$GITHUB_OUTPUT"
      - name: Publish mobile release assets
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$LUME_RELEASE_TAG" "${{ steps.assets.outputs.apk }}" "${{ steps.assets.outputs.manifest }}" --clobber

  publish-release:
    name: Publicar release validada
    needs: mobile-android
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Publicar artefatos validados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$LUME_RELEASE_TAG" --draft=false
