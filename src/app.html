<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/lume.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9fbfa" />
    <title>Lume</title>
    %sveltekit.head%
    <style>
      #lume-launch { position: fixed; z-index: 2147483647; left: 0; top: 0; width: 78px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(54, 92, 70, 0.38); border-radius: 22px; color: #263d35; background: #e6ead7; box-shadow: inset 0 0 0 1px rgba(247, 242, 220, 0.62), 0 5px 16px rgba(35, 62, 49, 0.12); pointer-events: none; transition: opacity 240ms ease; }
      #lume-launch[data-theme="dark"] { color: #dfe8e3; border-color: rgba(190, 209, 200, 0.13); background: #1b221f; box-shadow: none; }
      #lume-launch.leaving { opacity: 0; }
      #lume-launch svg { width: 32px; height: 32px; flex: 0 0 auto; overflow: visible; }
      #lume-launch .body { fill: #8b9490; }
      #lume-launch .belly { fill: rgba(255, 255, 255, 0.34); }
      #lume-launch .snout { fill: rgba(24, 48, 39, 0.16); }
      #lume-launch .face { fill: currentColor; }
      #lume-launch .zzz { fill: #828b87; animation: lume-launch-zzz 2.4s steps(3, end) infinite; }
      #lume-launch .dino { animation: lume-launch-breathe 2.4s steps(2, end) infinite; }
      #lume-launch .dots { min-width: 19px; height: 19px; padding: 0 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; background: #2f6749; }
      #lume-launch[data-theme="dark"] .dots { background: #30473e; }
      #lume-launch .dots i { width: 3px; height: 3px; border-radius: 50%; background: #f8faf9; opacity: 0.35; animation: lume-launch-dot 1.1s ease-in-out infinite; }
      #lume-launch .dots i:nth-child(2) { animation-delay: 0.18s; }
      #lume-launch .dots i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes lume-launch-breathe { 50% { transform: translateY(1px); } }
      @keyframes lume-launch-zzz { 50% { opacity: 0.45; transform: translate(1px, -1px); } }
      @keyframes lume-launch-dot { 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #lume-launch .dino, #lume-launch .zzz, #lume-launch .dots i { animation: none; } }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- The Orb's own first frame: a sleeping Lume in its capsule, painted before any script runs, so
         opening the app never shows an empty window. The Orb takes over (see launchSplash.ts). -->
    <div id="lume-launch" aria-hidden="true">
      <svg viewBox="0 0 32 32" shape-rendering="crispEdges">
        <g class="dino">
          <path class="body" d="M4 16h3v-2h3V9h3V6h11v2h3v8h-9v2h4v4h-5v4h-4v-5h-3v5H7v-5H5v-2H3v-4h1z" />
          <path class="belly" d="M10 15h3v2h5v3h-8z" />
          <rect class="snout" x="23" y="13" width="4" height="2" />
          <rect class="face" x="21" y="10" width="4" height="1" />
          <g class="face"><rect x="7" y="25" width="5" height="2" /><rect x="13" y="25" width="5" height="2" /></g>
        </g>
        <g class="zzz"><path d="M24 3h5v1h-3v1h3v1h-5V5h2V4h-2z" /><path d="M27 0h3v1h-1v1h1v1h-3V2h1V1h-1z" /></g>
      </svg>
      <span class="dots"><i></i><i></i><i></i></span>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("lume-launch");
        // Only the Orb window of the desktop app opens like this.
        if (!("__TAURI_INTERNALS__" in window) || location.pathname !== "/") { splash.remove(); return; }
        var theme = "";
        try { theme = localStorage.getItem("lume:launch-theme") || ""; } catch (error) { /* optional */ }
        if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        splash.setAttribute("data-theme", theme);
        // A failed start must never leave the capsule over the Orb.
        setTimeout(function () { if (splash.isConnected) splash.remove(); }, 9000);
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
