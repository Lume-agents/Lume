[package]
name = "codex-presence-validation"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false

[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
